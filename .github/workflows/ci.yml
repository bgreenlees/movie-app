name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch/PR cancels the run that's still going for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Same Node major as Vercel and local dev; .nvmrc is the single source of truth.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on high/critical advisories in what ships (production dependencies).
      # Dev tooling is left to Dependabot so a build-time-only advisory can't block every PR.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Generates the typed Prisma client so type-checking works. It never connects
      # to a database; the placeholder URL only satisfies schema validation.
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://x@localhost/x

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
