name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch/PR cancels the run that's still going for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Same Node major as Vercel and local dev; .nvmrc is the single source of truth.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on high/critical advisories in what ships (production dependencies).
      # Dev tooling is left to Dependabot so a build-time-only advisory can't block every PR.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Generates the typed Prisma client so type-checking works. It never connects
      # to a database; the placeholder URL only satisfies schema validation.
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://x@localhost/x

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # End-to-end smoke tests (issue #110): a real browser signs in with the dev login and
  # clicks through the core flows against the app, a fake TMDB, and a throwaway Postgres
  # that only exists for this job. No secrets, no Neon, no production data.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://e2e:e2e@localhost:5432/e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Creates the tables in the throwaway database (migrations aren't committed; see CLAUDE.md).
      - name: Create database schema
        run: npx prisma db push --skip-generate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
