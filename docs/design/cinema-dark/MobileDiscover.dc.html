<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discover — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0f}
a{color:#c4b5fd;text-decoration:none}a:hover{color:#ddd6fe}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0b0b0f; color: #f4f4f6; font-family: Lato, system-ui, sans-serif; font-size: 16px; line-height: 24px; display: flex; flex-direction: column;">

  <header style="height: 56px; flex: none; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #2e2e3a;">
    <span style="width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg,#a855f7,#3b82f6); display: flex; align-items: center; justify-content: center;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg>
    </span>
    <span style="font-weight: 700; font-size: 17px;">What's Up Next</span>
    <button aria-label="Account" style="margin-left: auto; width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <span style="width: 32px; height: 32px; border-radius: 999px; background: #1f1f29; color: #c4b5fd; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center;">B</span>
    </button>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 20px 0 0; display: flex; flex-direction: column; gap: 28px;">

    <section style="margin: 0 16px; padding: 16px; border-radius: 16px; background: #15151c; border: 1px solid #2e2e3a; display: flex; flex-direction: column; gap: 12px;">
      <h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 24px; line-height: 30px;">What are you in the mood for?</h1>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <sc-for list="{{moods}}" as="m" hint-placeholder-count="4">
          <button style="{{m.style}}">{{m.label}}</button>
        </sc-for>
      </div>
    </section>

    <sc-for list="{{shelves}}" as="shelf" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; align-items: baseline; padding: 0 16px;">
          <h2 style="margin: 0; font-size: 18px; line-height: 24px;">{{shelf.title}}</h2>
          <a href="#" style="margin-left: auto; font-size: 14px; font-weight: 700; padding: 10px 0;">See all</a>
        </div>
        <div style="display: flex; gap: 12px; padding: 0 16px; overflow: hidden;">
          <sc-for list="{{shelf.items}}" as="item" hint-placeholder-count="4">
            <article style="flex: none; width: 108px; display: flex; flex-direction: column; gap: 8px;">
              <div style="{{item.posterStyle}}">
                <span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent 45%); border-radius: 12px;"></span>
                <button aria-label="Add {{item.title}} to a list" style="position: absolute; right: 6px; bottom: 6px; width: 32px; height: 32px; border-radius: 999px; border: 0; background: #7c3aed; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
              </div>
              <div>
                <h3 style="margin: 0; font-size: 14px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{item.title}}</h3>
                <p style="margin: 0; font-size: 12px; line-height: 16px; color: #a1a1aa;">{{item.meta}}</p>
              </div>
            </article>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>

  <nav aria-label="Main" style="flex: none; height: 76px; padding: 6px 8px 14px; box-sizing: border-box; background: rgba(21,21,28,0.96); border-top: 1px solid #2e2e3a; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="#" aria-current="{{t.current}}" style="{{t.style}}">
        <span style="{{t.pill}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg></span>
        <span style="font-size: 11px; line-height: 14px; font-weight: 700;">{{t.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (label, on) => ({ label, style: 'height: 40px; padding: 0 14px; border-radius: 999px; font: 700 14px/1 Lato, system-ui, sans-serif; cursor: pointer; ' + (on ? 'background: #f4f4f6; color: #0b0b0f; border: 1px solid #f4f4f6;' : 'background: #1f1f29; color: #f4f4f6; border: 1px solid #2e2e3a;') });
    const p = (title, meta, a) => ({ title, meta, posterStyle: 'position: relative; width: 108px; height: 162px; border-radius: 12px; background: linear-gradient(160deg,' + a + ',#0f0f14);' });
    const tab = (label, icon, on) => ({
      label, icon, current: on ? 'page' : 'false',
      style: 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 56px; ' + (on ? 'color: #c4b5fd;' : 'color: #a1a1aa;'),
      pill: 'width: 52px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: rgba(124,58,237,0.22);' : '')
    });
    return {
      moods: [chip('Light', true), chip('Intense'), chip('~30 min', true), chip('My services')],
      shelves: [
        { title: 'Continue watching', items: [p('The Bear', 'S3 · E2', '#3b2f2f'), p('Severance', 'S2 · E7', '#1e3a4a'), p('Slow Horses', 'S4 · E1', '#2f3b2a'), p('Shogun', 'S1 · E9', '#4a2a1e')] },
        { title: 'New on your services', items: [p('Dune: Part Two', '2024 · Movie', '#5a3d1e'), p('Poor Things', '2023 · Movie', '#2b3d4f'), p('Shrinking', '2025 · TV', '#2a4a3a'), p('Past Lives', '2023 · Movie', '#24384a')] }
      ],
      tabs: [
        tab('Discover', 'M3 11l9-8 9 8M5 10v10h14V10', true),
        tab('New', 'M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z'),
        tab('Search', 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.35-4.35'),
        tab('Movies', 'M4 4h16v16H4zM8 4v16M16 4v16M4 9h4M16 9h4M4 15h4M16 15h4'),
        tab('My TV', 'M3 7h18v12H3zM8 3l4 4 4-4')
      ]
    };
  }
}
</script>
</body>
</html>
